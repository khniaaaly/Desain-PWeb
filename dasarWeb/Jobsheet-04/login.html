<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini - Login Petugas</title>
  <style>
    :root { --teal: #00c4b9; --teal-dark: #00a89e; --bg: #f5f7f9; --panel: #eef3fa; --text: #222; --muted: #4a5d75; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--teal); padding: 24px 36px; }
    header h1 { margin: 0; color: #fff; font-size: 28px; }
    main { max-width: 440px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 36px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    h2 { margin: 0 0 24px; color: var(--teal); font-size: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: var(--muted); }
    input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid transparent; border-radius: 10px; background: var(--panel); }
    input:focus { outline: none; border-color: var(--teal); background: #fff; }
    button { width: 100%; margin-top: 8px; padding: 13px; font-size: 16px; font-weight: bold; color: #fff; background: var(--teal); border: 0; border-radius: 10px; cursor: pointer; }
    button:hover { background: var(--teal-dark); }
    .daftar { margin: 24px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
    .daftar a { color: var(--teal); font-weight: bold; text-decoration: none; }
    .daftar a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><h1>SIMPUS-Mini</h1></header>
  <main>
    <div class="card">
      <h2>Login Petugas</h2>
      <form action="#" method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password">
        </div>
        <button type="submit">Masuk</button>
      </form>
      <p class="daftar">Belum punya akun? <a href="#">Daftar di sini</a></p>
    </div>
  </main>
</body>
</html>
