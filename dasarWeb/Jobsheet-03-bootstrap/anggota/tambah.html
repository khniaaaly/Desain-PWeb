<!DOCTYPE html>

    <meta charset="UTF-8">

</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main>
        <section>
            <span>* (Wajib diisi)</span>
            <h2>Tambah Anggota</h2>
            <form method="POST" action="">
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama_lengkap" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">No. Anggota</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir</label><br>
                    <input type="datetime-local" value="dd/mm/yyyy hh:mm:ss" id="tanggal_lahir" name="tanggal_lahir" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <textarea id="alamat" rows="10" cols="30" name="alamat"></textarea>
                    <input type="text" id="alamat" name="alamat" required>
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="number" id="no_hp" name="no_hp" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
